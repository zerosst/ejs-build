name: Build core (single)

# 为什么不用官方的 compile.yml:
#   官方那份跑在**自托管 runner** 上(`runs-on: [ self-hosted, linux, x64, emulatorjs-build ]`),
#   还依赖仓库变量 `vars.EMSCRIPTENSDKVERSION`、SSH secrets(rsync 到 CDN)、以及
#   attest-build-provenance 权限 —— fork 里这些都不存在, 直接跑会全红。
#   这里换成 ubuntu-latest 的**最小可用版**: 装依赖 + emsdk + 拉核心并打 EJS 补丁 + 构建 + 传产物。

on:
  workflow_dispatch:
    inputs:
      core:
        description: '要构建的核心名(cores.json 里的 name)'
        required: true
        default: 'fbalpha2012_neogeo'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # 腾空间: RetroArch + emsdk + 中间产物很占地方, runner 默认可用空间可能不够
      - name: 腾出磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkgconf python3 git zip unzip \
            jq wget curl patch cmake p7zip-full rsync
          # build.sh 里 `perl scripts/gamelist.pl` 生成 driverlist.h —— runner 自带 perl, 这里确认一下
          perl -v | head -2

      - name: 安装 emsdk 3.1.74
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install 3.1.74
          ./emsdk activate 3.1.74

      # ★ 关键一步: 把"上游核心 + EJS 补丁"预置到 build.sh 期望的位置。
      #   build.sh 的 compileProject 里有 `if [ ! -d "$name" ]; then git clone ...; fi`
      #   —— 目录已存在就**不会去 clone**, 直接用我们这份。这样:
      #     ① 不用建第二个仓库(核心源码不进任何仓库) ② 补丁应用在 CI 里(网络快) ③ 结果可复现
      #   (cores.json 里那个 repo 字段只在目录缺失时才用, 留着是为了记录来源)
      # ⚠️ 预置核心源码到 build.sh 期望的位置(compile/<name>)。
      #    build.sh 是 `if [ ! -d "$name" ]; then git clone ...; fi` —— 目录已存在就**不 clone**,
      #    用它现成的。这样**核心源码不必进任何仓库**: 这里从上游 clone 再覆盖我们改过的文件。
      #    (另外两个核心的仓库模式没走通: 本机推 27MB 时本地代理 502/408, 换成"CI 自己 clone"最稳。)
      - name: 预置 core 源码并打补丁
        # PGM 与其变体(如 fbalpha2012_pgm_dbg = 带调试信息的诊断版)走同一套预置逻辑
        if: github.event.inputs.core == 'fbalpha2012_neogeo' || startsWith(github.event.inputs.core, 'fbalpha2012_pgm')
        run: |
          CORE=${{ github.event.inputs.core }}
          mkdir -p compile
          if [ "$CORE" = "fbalpha2012_neogeo" ]; then
            git clone --depth 1 https://github.com/libretro/fbalpha2012_neogeo.git "compile/$CORE"
            cp "core-patch/makefile.libretro" "compile/$CORE/makefile.libretro"
          else
            # PGM: 上游**没有** PGM 子集, 只有全驱动树 -> clone 完整树, 把 svn-current/trunk 的内容搬到根,
            # 再覆盖我们改过的 makefile(加了 target=pgm 分支)与 gamelist(只留 115 款 PGM 游戏)
            git clone --depth 1 https://github.com/libretro/fbalpha2012.git /tmp/fba
            cp -r /tmp/fba/svn-current/trunk/. "compile/$CORE/"
            cp "boards/fbalpha2012_pgm/makefile.libretro" "compile/$CORE/makefile.libretro"
            cp "boards/fbalpha2012_pgm/gamelist.txt" "compile/$CORE/gamelist.txt"
            # ★ 还要覆盖 retro_common.cpp: 它的 set_neo_system_bios() 引用 NeoSystem(NeoGeo 的
            #   MVS/AES/UNIBIOS 模式), 而这个引用**没有任何 #if 守卫** —— 完整树里 libretro 前端是拆成
            #   三个文件的, 而机板子集用的是"合并版 libretro.cpp"(所以子集没事)。
            #   不补 -> 链接期 52 条 `undefined symbol: NeoSystem`(编译全绿)。
            cp "boards/fbalpha2012_pgm/retro_common.cpp" "compile/$CORE/src/burner/libretro/retro_common.cpp"
            # ★ arm7 页表清零补丁 —— kov2 "跑 ~764 帧后崩" 的根因:
            #   `Arm7Init` 用 malloc 分配 `membase[3]`(读/写/取指三张页表)却**从不清零**;
            #   而三条读写路径都靠 `if (membase[X][page] != NULL)` 判"有没有映射" —— 即
            #   "未映射 == NULL"是这里的约定。malloc 后表里全是垃圾指针(几乎都不是 NULL),
            #   于是任何**未映射**地址都会拿垃圾指针去解引用: 原生构建多半只是读到乱数据
            #   (所以上游多年没发现), 而 wasm 里一越界就 trap -> 稳定崩在
            #   `Arm7_program_read_byte_32le`。FBNeo 在**同一处**补了 memset, 我们照抄。
            echo "--- 打 arm7 页表清零补丁 ---"
            # ⚠️ `patch -d` 会**先 chdir**, 所以 -i 的路径必须是**绝对**的(踩过: 用了仓库相对路径 -> Can't open patch file)
            patch -d "compile/$CORE" -p1 -i "$PWD/boards/fbalpha2012_pgm/patches/arm7_zero_membase.patch" || exit 1
            # ⚠️ 必须**验证生效**: 补丁没打上一样会"绿勾 + 空产物"(这坑吃过一次)
            grep -q 'memset(membase\[i\], 0, ARM7_PAGE_COUNT' "compile/$CORE/src/cpu/arm7_intf.cpp" \
              || { echo "❌ arm7 补丁没生效(补丁文件与上游上下文对不上?)"; exit 1; }
            echo "✔ arm7 页表清零补丁已生效"
            echo "--- 确认守卫已就位 ---"
            grep -c "defined(WANT_NEOGEOCD)" "compile/$CORE/src/burner/libretro/retro_common.cpp" || true
            # ★ 必须**重新生成 driverlist.h**: 完整树自带的那份是按"全游戏"gamelist 生成的
            #   (11942 条 BurnDrv 引用), 而我们只编 PGM -> 链接期几百条
            #   `undefined symbol: BurnDrvCps1941 / BurnDrvmd_12in1 / ...`
            #   (编译全绿, 只在链接炸 —— 极易误判成"编过了")。生成器是 perl(CI 有, 本机没有)。
            ( cd "compile/$CORE" && perl src/dep/scripts/gamelist.pl -o src/dep/generated/driverlist.h -l gamelist.txt src/burn/drv/pgm )
            echo "--- 重新生成后的 driverlist.h ---"
            wc -l "compile/$CORE/src/dep/generated/driverlist.h"
            grep -c "BurnDrv" "compile/$CORE/src/dep/generated/driverlist.h" || true
            grep -c "BurnDrvKov;" "compile/$CORE/src/dep/generated/driverlist.h" || true
            # ★ makefile 语法预检: `make -n` 只解析不执行 —— 语法错会在这里**立刻**暴露,
            #   不用等 4 分钟构建完才看到(实测踩过: 续行中间插注释 -> `recipe commences before first target`)。
            echo "--- makefile 语法自检(干跑) ---"
            if ( cd "compile/$CORE" && make -n -f makefile.libretro platform=emscripten target=pgm >/dev/null 2>&1 ); then
              echo "✔ makefile 语法 OK"
            else
              echo "❌ makefile 语法错误:"
              ( cd "compile/$CORE" && make -n -f makefile.libretro platform=emscripten target=pgm 2>&1 | head -25 )
              exit 1
            fi
          fi
          echo "--- 校验: EJS 补丁在位 ---"
          grep -n 'EMULATORJS_THREADS ?=' "compile/$CORE/makefile.libretro"
          grep -n 'EXTERNAL_ZLIB = 1' "compile/$CORE/makefile.libretro" | head -2
          echo "--- 校验: 本机板分支/清单 ---"
          grep -n 'target),' "compile/$CORE/makefile.libretro" | head -8
          grep -c 'PolyGameMaster' "compile/$CORE/gamelist.txt" || echo '(gamelist 无 PGM 行)'

      - name: 构建核心
        run: |
          source emsdk/emsdk_env.sh
          bash build.sh --core=${{ github.event.inputs.core }}

      # 失败也要留证据: build.sh 的输出几乎全在 output/logs 里
      - name: 打印日志尾部
        if: always()
        run: |
          echo "===== output/ ====="; ls -la output/ 2>/dev/null || true
          echo "===== output/reports ====="; cat output/reports/*.json 2>/dev/null || true
          echo "===== 编译日志(尾 150 行) ====="
          tail -n 150 output/logs/*-compile.log 2>/dev/null || true
          echo "===== 链接日志(尾 150 行) ====="
          tail -n 150 output/logs/*-emake.log 2>/dev/null || true

      # ★ 联机取证: 独立步骤 + if: always() —— **不可能**弄坏上面的构建。
      #   (教训: 把取证写进 build.sh, 一次语法错就让整轮构建变红, 连产物都拿不到。)
      - name: netplay 取证(与构建解耦)
        if: always()
        run: |
          mkdir -p output
          {
            echo "=== netplay 取证(独立步骤) ==="
            echo "--- 全树 *_libretro.js : step / sim / size ---"
            for JS in $(find . -name '*_libretro.js' 2>/dev/null | head -10); do
              echo "$JS : step=$(grep -c _ejs_step_frames "$JS" || true) sim=$(grep -c _simulate_input "$JS" || true) size=$(wc -c < "$JS" || true)"
            done
            echo "--- 打包源 EmulatorJS/data/cores/ 下的 js ---"
            for JS in compile/RetroArch/EmulatorJS/data/cores/*_libretro.js; do
              [ -f "$JS" ] || continue
              echo "$JS : step=$(grep -c _ejs_step_frames "$JS" || true) sim=$(grep -c _simulate_input "$JS" || true) size=$(wc -c < "$JS" || true)"
            done
            echo "--- 构建后的导出表(124-126 行) ---"
            sed -n "124,126p" compile/RetroArch/Makefile.emulatorjs 2>/dev/null || true
          } > output/netplay-diag.txt 2>&1 || true
          {
            echo "--- emulatorjs/ 目录(编译产出) ---"
            ls -la compile/RetroArch/emulatorjs/ 2>/dev/null | head -30 || true
            echo "--- EmulatorJS/data/cores/(打包源) ---"
            ls -la compile/RetroArch/EmulatorJS/data/cores/fbalpha2012_cps1* 2>/dev/null | head -20 || true
            echo "--- 全树 wasm / *_libretro.js ---"
            find . -name '*.wasm' -o -name '*_libretro.js' 2>/dev/null | head -20
            echo "--- 取出过的 .data 里那份 js 的符号数(如果 data/cores 里有) ---"
            for JS in compile/RetroArch/EmulatorJS/data/cores/fbalpha2012_cps1*.js; do
              [ -f "$JS" ] || continue
              echo "$JS step=$(grep -c _ejs_step_frames "$JS" || true) sim=$(grep -c _simulate_input "$JS" || true)"
            done
          } >> output/netplay-diag.txt 2>&1 || true
          cat output/netplay-diag.txt || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ github.event.inputs.core }}
          if-no-files-found: warn
          path: |
            output/*.data
            output/*.zip
            output/cores.json
            output/*.txt
            output/logs/*
            output/reports/*
            compile/RetroArch/EmulatorJS/data/cores/fbalpha2012_cps1*
            compile/RetroArch/emulatorjs/fbalpha2012_cps1*
            output/reports/**
            output/logs/**
            compile/build.json
